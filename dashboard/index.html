<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Log Sec SIEM Dashboard">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search,home,description,monitoring,timeline,shield,settings" />
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="home/home.css">
        <script src="home/home.js" defer></script>
        <script src="app.js" defer></script>
        <link rel="icon" type="image/png" href="xicon.png">
        <title>LogSec Dashboard</title>
    </head>
    <body>
        <div class="app-container">
            <aside class="sidebar">
                <img src="LS_logo.png" alt="Log Sec Logo" class="logo">
                
                <div class="sidebar-top">
                    <div class="sidebar-item divider">
                        <span class="material-symbols-outlined">search</span>
                        <span class="icon-text">Search</span>
                    </div>

                    <div class="sidebar-item" id="nav-home">
                        <span class="material-symbols-outlined">home</span>
                        <span class="icon-text">Home</span>
                    </div>

                    <div class="sidebar-item">
                        <span class="material-symbols-outlined">description</span>
                        <span class="icon-text">Events</span>
                    </div>

                    <div class="sidebar-item">
                        <span class="material-symbols-outlined">monitoring</span>
                        <span class="icon-text">Metrics</span>
                    </div>

                    <div class="sidebar-item">
                        <span class="material-symbols-outlined">timeline</span>
                        <span class="icon-text">Traces</span>
                    </div>

                    <div class="sidebar-item">
                        <span class="material-symbols-outlined">shield</span>
                        <span class="icon-text">SIEM</span>
                    </div>
                </div>

                <div class="sidebar-bottom">
                    <div class="sidebar-item">
                        <span class="material-symbols-outlined">settings</span>
                        <span class="icon-text">Settings</span>
                    </div>
                </div>
            </aside>
            
            <main id="app"></main>
        </div>
    </body>
</html>
